[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "lisovyi"
version = "0.1.0"
description = "Telegram bot that answers forest beasts from the Forest Archive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "pypdf>=6.21,<7",
    "pypdfium2>=5.14,<6",
    "python-docx>=1.2,<2",
    "pytesseract>=0.3.13,<0.4",
    "Pillow>=13,<14",
    "pymorphy3>=2.0.6,<3",
    "pymorphy3-dicts-uk>=2.4.1",
    "groq>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.3",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Системний промпт — дослівний текст із брифу, його рядки не переносяться.
"src/lisovyi/answer/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Дедлок (наприклад, на замку діалогу) має впасти з трасою за хвилину, а не висіти.
timeout = 60
markers = [
    "ocr: runs the real tesseract binary with the ukr language",
    "db: needs a disposable PostgreSQL database passed in DATABASE_URL",
]
